name: housesync

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-housesync}
      POSTGRES_USER: ${DB_USER:-housesync}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env; see .env.example}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    profiles: [app]
    build:
      context: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-housesync}
      DB_USER: ${DB_USER:-housesync}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env; see .env.example}
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    profiles: [app]
    build:
      context: ./web
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
