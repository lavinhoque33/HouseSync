name: housesync

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-housesync}
      POSTGRES_USER: ${DB_USER:-housesync}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env; see .env.example}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    profiles: [app]
    build:
      context: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-housesync}
      DB_USER: ${DB_USER:-housesync}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env; see .env.example}
      SERVER_PORT: "8080"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CONNECTED_FINANCE_ENABLED: ${CONNECTED_FINANCE_ENABLED:-false}
      CONNECTED_FINANCE_PROVIDER: ${CONNECTED_FINANCE_PROVIDER:-plaid}
      CONNECTED_FINANCE_FAKE_ALLOWED: ${CONNECTED_FINANCE_FAKE_ALLOWED:-false}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_REDIRECT_URL: ${PLAID_REDIRECT_URL:-}
      PLAID_WEBHOOK_URL: ${PLAID_WEBHOOK_URL:-}
      CONNECTED_FINANCE_KEYS: ${CONNECTED_FINANCE_KEYS:-}
      CATEGORIZATION_AI_ENABLED: ${CATEGORIZATION_AI_ENABLED:-false}
      CATEGORIZATION_AI_KEY: ${CATEGORIZATION_AI_KEY:-}
      CATEGORIZATION_AI_MODEL: ${CATEGORIZATION_AI_MODEL:-}
      CATEGORIZATION_AI_POLICY: ${CATEGORIZATION_AI_POLICY:-}
      CATEGORIZATION_AI_BASE_URL: ${CATEGORIZATION_AI_BASE_URL:-https://api.openai.com/v1/chat/completions}
      CATEGORIZATION_AI_TIMEOUT_MS: ${CATEGORIZATION_AI_TIMEOUT_MS:-5000}
      CATEGORIZATION_AI_POLL_MS: ${CATEGORIZATION_AI_POLL_MS:-1000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    profiles: [app]
    build:
      context: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
