server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Attribute requests to the real client. Only private Docker-network peers (the hosted Caddy
    # reverse proxy) and loopback may supply X-Forwarded-For; the rightmost untrusted address
    # becomes $remote_addr. Any other peer's forwarded headers are ignored.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker's embedded DNS. Resolve per request so nginx can start before backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # $request_uri preserves the full original path and query string.
    # These routes never fall through to the SPA, including upstream failures.
    location ~ ^/(api|actuator)(/|$) {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the backend trusts this hop and must see only the attributed client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.plaid.com/link/v2/stable/link-initialize.js; style-src 'self' 'unsafe-inline'; frame-src https://cdn.plaid.com/; connect-src 'self' https://sandbox.plaid.com https://production.plaid.com; img-src 'self' data: https://cdn.plaid.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.plaid.com/link/v2/stable/link-initialize.js; style-src 'self' 'unsafe-inline'; frame-src https://cdn.plaid.com/; connect-src 'self' https://sandbox.plaid.com https://production.plaid.com; img-src 'self' data: https://cdn.plaid.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # The invitation route carries a fragment secret in the address bar.
    # Serve the SPA shell without storing it anywhere on the path.
    location ~ ^/join(/|$) {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.plaid.com/link/v2/stable/link-initialize.js; style-src 'self' 'unsafe-inline'; frame-src https://cdn.plaid.com/; connect-src 'self' https://sandbox.plaid.com https://production.plaid.com; img-src 'self' data: https://cdn.plaid.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.plaid.com/link/v2/stable/link-initialize.js; style-src 'self' 'unsafe-inline'; frame-src https://cdn.plaid.com/; connect-src 'self' https://sandbox.plaid.com https://production.plaid.com; img-src 'self' data: https://cdn.plaid.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
