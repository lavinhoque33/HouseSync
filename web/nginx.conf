server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Docker's embedded DNS. Resolve per request so nginx can start before backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # $request_uri preserves the full original path and query string.
    # These routes never fall through to the SPA, including upstream failures.
    location ~ ^/(api|actuator)(/|$) {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Referrer-Policy "no-referrer" always;
    }

    # The invitation route carries a fragment secret in the address bar.
    # Serve the SPA shell without storing it anywhere on the path.
    location ~ ^/join(/|$) {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
    }
}
