name: HouseSync checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan complete repository history for secrets
        shell: bash
        run: |
          tool_dir="$(mktemp -d)"
          trap 'rm -rf -- "$tool_dir"' EXIT
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tool_dir/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$tool_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" git . --log-opts=--all --redact=100 \
            --max-decode-depth=2 --max-archive-depth=2 --ignore-gitleaks-allow --no-banner

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify formatting, tests, package, and PostgreSQL integration
        run: make backend-check
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Verify lint, types, formatting, behavior, and build
        run: make web-check

  containers:
    needs: [backend, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example --profile app config --quiet
      - name: Build and wait for the local stack
        run: docker compose --env-file .env.example --profile app up --build -d --wait --wait-timeout 180
      - name: Exercise web and its real backend proxy
        shell: bash
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8081/ --output /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8081/actuator/health | python3 -c 'import json,sys; body=json.load(sys.stdin); assert isinstance(body,dict) and body.get("status")=="UP", body; assert not {"components","details"}.intersection(body), body'
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/api/auth/me)" = 401
          test "$(curl --silent --show-error --request POST --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/api/auth/logout)" = 403
      - name: Show stack diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file .env.example --profile app ps -a
          docker compose --env-file .env.example --profile app logs --no-color --tail 100
      - name: Stop local stack
        if: always()
        run: docker compose --env-file .env.example --profile app down
