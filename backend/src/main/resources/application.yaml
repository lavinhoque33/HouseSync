spring:
  application:
    name: housesync-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:housesync}
    username: ${DB_USER:housesync}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  jackson:
    read:
      strict-duplicate-detection: true
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  # Tomcat RemoteIpValve: getRemoteAddr() becomes the X-Forwarded-For client only when the direct
  # peer is one of these proxies (loopback, or the private Docker ranges nginx runs in). A direct
  # untrusted peer's forwarded headers are ignored. Session cookie Secure is set explicitly by
  # app.session-cookie-secure, so X-Forwarded-Proto never changes it.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.\d{1,3}\.\d{1,3}|127\.0\.0\.1'
  servlet:
    session:
      timeout: 30m

app:
  session-cookie-secure: ${SESSION_COOKIE_SECURE:true}
  auth:
    ip-max-attempts: 30
    ip-window-seconds: 60
    login-email-max-attempts: 10
    login-email-window-seconds: 600
    session-max-creations: 30
    session-window-seconds: 600
  connected-finance:
    enabled: ${CONNECTED_FINANCE_ENABLED:false}
    provider: ${CONNECTED_FINANCE_PROVIDER:plaid}
    fake-allowed: ${CONNECTED_FINANCE_FAKE_ALLOWED:false}
    environment: ${PLAID_ENV:sandbox}
    client-id: ${PLAID_CLIENT_ID:}
    secret: ${PLAID_SECRET:}
    base-url: ${PLAID_BASE_URL:}
    redirect-url: ${PLAID_REDIRECT_URL:}
    webhook-url: ${PLAID_WEBHOOK_URL:}
    encryption-keys: ${CONNECTED_FINANCE_KEYS:}
    attempt-ttl-minutes: 30
    # Documented application ceilings are 50,000 deltas / 50 MiB; startup validation rejects any
    # configured value above them, so lowering these for diagnostics never weakens production.
    sync-max-round-deltas: ${CONNECTED_FINANCE_SYNC_MAX_DELTAS:50000}
    sync-max-round-bytes: ${CONNECTED_FINANCE_SYNC_MAX_BYTES:52428800}
    revocation-poll-ms: 60000
  categorization-ai:
    enabled: ${CATEGORIZATION_AI_ENABLED:false}
    key: ${CATEGORIZATION_AI_KEY:}
    model: ${CATEGORIZATION_AI_MODEL:}
    policy: ${CATEGORIZATION_AI_POLICY:}
    base-url: ${CATEGORIZATION_AI_BASE_URL:https://api.openai.com/v1/chat/completions}
    timeout-ms: ${CATEGORIZATION_AI_TIMEOUT_MS:5000}
    poll-ms: ${CATEGORIZATION_AI_POLL_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
